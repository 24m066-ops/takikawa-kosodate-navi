<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>相談・チャット｜たきかわ子育てナビ</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .chat-box,.post-card {
      background:white;
      padding:22px;
      border-radius:20px;
      margin:20px 0;
    }

    .chat-box input,
    .chat-box select,
    .chat-box textarea {
      width:100%;
      box-sizing:border-box;
      padding:12px;
      margin:8px 0 15px;
      border:1px solid #ddd;
      border-radius:10px;
      font:inherit;
    }

    .chat-box label {
      display:block;
      font-weight:bold;
      margin-top:10px;
    }

    .post-card p,.reply p {
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }

    .reply {
      background:#f3f9f6;
      padding:12px;
      border-radius:12px;
      margin:10px 0;
    }

    .reply-form {
      display:flex;
      gap:8px;
      margin-top:12px;
    }

    .reply-form input {
      flex:1;
      min-width:0;
      padding:10px;
      border:1px solid #ddd;
      border-radius:10px;
    }

    .post-actions {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:12px;
    }

    .post-date {
      color:#888;
      font-size:12px;
    }

    .chat-message {
      padding:12px;
      border-radius:12px;
      background:#fff5f0;
      margin:15px 0;
    }
  </style>
</head>

<body>
<div class="app">

  <header class="top">
    <a class="logo" href="index.html">
      🌷 たきかわ子育てナビ
      <small>毎日の子育てを、もっと安心・もっと楽しく</small>
    </a>

    <nav class="menu">
      <a href="events.html">📅 イベント</a>
      <a href="notifications.html">🔔 通知</a>
      <a href="places.html">📍 施設</a>
      <a href="favorites.html">❤️ お気に入り</a>
      <a href="records.html">🌱 記録</a>
      <a href="contact.html">📖 連絡帳</a>
      <a href="chat.html">💬 相談</a>
    </nav>
  </header>

  <section class="section">
    <div class="title">
      <h2>💬 子育て相談ひろば</h2>
      <p>子育ての悩みや情報をみんなで共有しよう🌷</p>
    </div>

    <div id="loginNotice" class="chat-message">
      ログイン状態を確認しています...
    </div>

    <div class="chat-box">
      <h3>🌷 新しく相談する</h3>

      <form id="postForm">
        <label for="postCategory">相談のカテゴリー</label>
        <select id="postCategory">
          <option>🌳 お出かけ・遊び場</option>
          <option>🍚 食事・生活</option>
          <option>🏫 保育所・幼稚園</option>
          <option>💬 その他の相談</option>
        </select>

        <label for="postTitle">相談のタイトル</label>
        <input id="postTitle"
          placeholder="例：おすすめの公園を教えてください"
          maxlength="100" required>

        <label for="postText">相談内容</label>
        <textarea id="postText" rows="5"
          placeholder="相談したいことを書いてね"
          maxlength="2000" required></textarea>

        <button id="postButton"
          class="btn green" type="submit" disabled>
          📝 相談を投稿する
        </button>
      </form>
    </div>

    <h3>📚 みんなの相談</h3>
    <button class="btn light" id="reloadButton"
      type="button">🔄 最新の投稿を表示</button>

    <div id="postList">読み込み中...</div>

    <p style="font-size:12px;color:#777;">
      ※ 現在はテスト版です。投稿はログインした利用者に
      共有されます。名前・住所・電話番号・子どもの
      個人情報などは入力しないでください。
      緊急の相談には使用しないでください。
    </p>
  </section>

  <footer class="footer">
    🌷 たきかわ子育てナビ
    <small>子育てする人みんなが、安心して暮らせるまちへ。</small>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>
const db = supabaseClient;
let currentUser = null;

const postList = document.getElementById("postList");
const postForm = document.getElementById("postForm");
const postButton = document.getElementById("postButton");
const loginNotice = document.getElementById("loginNotice");

function showDate(value) {
  return new Date(value).toLocaleString("ja-JP");
}

function makeButton(text, className = "btn light") {
  const button = document.createElement("button");
  button.type = "button";
  button.className = className;
  button.textContent = text;
  return button;
}

async function initChat() {
  try {
    const { data, error } = await db.auth.getUser();
    if (error) throw error;

    currentUser = data.user;

    if (!currentUser) {
      loginNotice.textContent =
        "🔐 相談を利用するには、ホーム画面でログインしてください。";
      postButton.disabled = true;
      postList.textContent = "ログインすると相談を表示できます。";
      return;
    }

    loginNotice.textContent =
      "🌷 ログイン中です。相談や返信を利用できます！";
    postButton.disabled = false;

    await loadPosts();
  } catch (error) {
    console.error(error);
    loginNotice.textContent =
      "ログイン状態を確認できませんでした。";
    postList.textContent = "読み込みに失敗しました。";
  }
}

async function loadPosts() {
  postList.textContent = "相談を読み込んでいます...";

  const { data: posts, error } = await db
    .from("chat_posts")
    .select("id,user_id,category,title,content,created_at")
    .order("created_at", { ascending:false })
    .limit(100);

  if (error) {
    console.error(error);
    postList.textContent =
      "相談を読み込めませんでした。データベース設定を確認してください。";
    return;
  }

  if (!posts || posts.length === 0) {
    postList.textContent = "まだ相談は投稿されていません。";
    return;
  }

  const postIds = posts.map(post => post.id);

  const { data: replies, error: replyError } = await db
    .from("chat_replies")
    .select("id,post_id,user_id,content,created_at")
    .in("post_id", postIds)
    .order("created_at", { ascending:true });

  if (replyError) {
    console.error(replyError);
    postList.textContent =
      "返信を読み込めませんでした。設定を確認してください。";
    return;
  }

  renderPosts(posts, replies || []);
}

function renderPosts(posts, replies) {
  postList.replaceChildren();

  posts.forEach(post => {
    const card = document.createElement("div");
    card.className = "post-card";

    const category = document.createElement("small");
    category.textContent = post.category;

    const title = document.createElement("h3");
    title.textContent = post.title;

    const date = document.createElement("div");
    date.className = "post-date";
    date.textContent = showDate(post.created_at);

    const content = document.createElement("p");
    content.textContent = post.content;

    card.append(category,title,date,content);

    const replyTitle = document.createElement("h4");
    replyTitle.textContent = "💬 返信";
    card.appendChild(replyTitle);

    const postReplies = replies.filter(
      reply => reply.post_id === post.id
    );

    postReplies.forEach(reply => {
      const box = document.createElement("div");
      box.className = "reply";

      const text = document.createElement("p");
      text.textContent = reply.content;

      const date = document.createElement("small");
      date.textContent = showDate(reply.created_at);

      box.append(text,date);

      if (reply.user_id === currentUser.id) {
        const deleteReply = makeButton("🗑️ 返信を削除");

        deleteReply.onclick = async () => {
          if (!confirm("この返信を削除しますか？")) return;

          const { error } = await db
            .from("chat_replies")
            .delete()
            .eq("id",reply.id)
            .eq("user_id",currentUser.id);

          if (error) {
            console.error(error);
            alert("返信を削除できませんでした。");
            return;
          }

          await loadPosts();
        };

        box.appendChild(deleteReply);
      }

      card.appendChild(box);
    });

    const replyForm = document.createElement("form");
    replyForm.className = "reply-form";

    const replyInput = document.createElement("input");
    replyInput.placeholder = "返信を入力";
    replyInput.required = true;
    replyInput.maxLength = 1000;

    const replyButton = document.createElement("button");
    replyButton.className = "btn green";
    replyButton.type = "submit";
    replyButton.textContent = "返信";

    replyForm.append(replyInput,replyButton);

    replyForm.addEventListener("submit", async e => {
      e.preventDefault();

      const text = replyInput.value.trim();
      if (!text || !currentUser) return;

      replyButton.disabled = true;

      const { error } = await db
        .from("chat_replies")
        .insert({
          post_id:post.id,
          user_id:currentUser.id,
          content:text
        });

      replyButton.disabled = false;

      if (error) {
        console.error(error);
        alert("返信を保存できませんでした。");
        return;
      }

      await loadPosts();
    });

    card.appendChild(replyForm);

    if (post.user_id === currentUser.id) {
      const actions = document.createElement("div");
      actions.className = "post-actions";

      const deleteButton = makeButton("🗑️ 投稿を削除");

      deleteButton.onclick = async () => {
        if (!confirm("この相談を削除しますか？")) return;

        const { error } = await db
          .from("chat_posts")
          .delete()
          .eq("id",post.id)
          .eq("user_id",currentUser.id);

        if (error) {
          console.error(error);
          alert("投稿を削除できませんでした。");
          return;
        }

        await loadPosts();
      };

      actions.appendChild(deleteButton);
      card.appendChild(actions);
    }

    postList.appendChild(card);
  });
}

postForm.addEventListener("submit", async e => {
  e.preventDefault();

  if (!currentUser) {
    alert("先にホーム画面でログインしてください。");
    return;
  }

  const category = document.getElementById("postCategory").value;
  const title = document.getElementById("postTitle").value.trim();
  const content = document.getElementById("postText").value.trim();

  if (!title || !content) {
    alert("タイトルと相談内容を入力してください。");
    return;
  }

  postButton.disabled = true;

  const { error } = await db
    .from("chat_posts")
    .insert({
      user_id:currentUser.id,
      category,
      title,
      content
    });

  postButton.disabled = false;

  if (error) {
    console.error(error);
    alert("投稿を保存できませんでした。");
    return;
  }

  postForm.reset();
  alert("相談を投稿しました！🌷");
  await loadPosts();
});

document.getElementById("reloadButton")
  .addEventListener("click", loadPosts);

initChat();
</script>

</body>
</html>
